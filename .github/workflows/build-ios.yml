name: Build Mineradio iOS (Standalone)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/cli @capacitor/ios @capacitor/core

      - name: Build Web Assets
        run: |
          npx cap sync ios
          # 确保本地化 API 注入（同步后再次确认）
          mkdir -p ios/App/App/public/js
          cp public/js/netease-api.bundle.js public/js/standalone-bridge.js ios/App/App/public/js/

      - name: Build IPA (Ad-Hoc/Unsigned for TrollStore)
        run: |
          cd ios/App
          # 列出结构以便调试
          ls -R .
          
          # 尝试使用 project 编译，因为 Capacitor 6+ 可能没有 top-level workspace
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath Mineradio.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ENTITLEMENTS_REQUIRED=NO

          mkdir -p Payload
          cp -r Mineradio.xcarchive/Products/Applications/*.app Payload/
          zip -r Mineradio_v2.0_Standalone.ipa Payload
          
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Mineradio-IPA
          path: ios/App/Mineradio_v2.0_Standalone.ipa
